services:
  fundsflow:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://fundsflow:fundsflow@db:5432/fundsflow
      # Local/testing only — set a real random value for any shared deployment.
      - SESSION_SECRET=${SESSION_SECRET:-local-dev-secret-change-me}
      - AI_BASE_URL=${AI_BASE_URL:-https://macpenielit.dpdns.org/v1}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-auto/chat}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=fundsflow
      - POSTGRES_PASSWORD=fundsflow
      - POSTGRES_DB=fundsflow
    volumes:
      - fundsflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundsflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  fundsflow-db:
